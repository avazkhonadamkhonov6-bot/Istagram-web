name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: instagram_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/instagram_test
      JWT_SECRET: ci_secret_ci_secret_ci_secret_ci_secret
      NODE_ENV: test
      API_URL: http://127.0.0.1:4400
      NEXT_PUBLIC_WS_URL: http://127.0.0.1:4400
      NEXT_PUBLIC_API_MOCKING: 'off'
      PORT: '4400'
      WEB_ORIGIN: http://127.0.0.1:3301
      UPLOAD_DIR: /tmp/instagram-ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/shared build
      - run: pnpm --filter api db:deploy
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api test
      - run: pnpm --filter api build
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build
        env:
          NODE_ENV: production
      - run: node apps/api/test/seed-frontend.cjs
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:completion
        env:
          QA_START_SERVERS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: apps/web/test-results/completion
          retention-days: 7
      - run: pnpm audit --audit-level=high --prod
        continue-on-error: true
