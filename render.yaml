# Render Blueprint: API-i umumi (NestJS) + PostgreSQL. Ba'd az push: Render → New → Blueprint → hamin repo.
# Frontend (Avaz va Abubakr) dar kompyuteri xud: apps/web/.env.local → API_URL va NEXT_PUBLIC_WS_URL = URL-i hamin service.
services:
  - type: web
    name: instagram-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @repo/shared build && pnpm --filter api build
    # Migratsiyaho dar har start (dar plan-i free preDeploy nest)
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: instagram-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Frontend-i lokali; agar web ham deploy shavad — URL-ash bo vergul ilova meshavad
      - key: WEB_ORIGIN
        value: http://localhost:3000
      - key: UPLOAD_DIR
        value: uploads

databases:
  - name: instagram-db
    plan: free
    region: frankfurt
    databaseName: instagram
    user: instagram
